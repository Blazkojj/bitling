name: Release

# Push a tag like v0.2.0 (or run it manually with a tag name) to build
# installers for every platform and attach them to a draft GitHub release.
# A manual run without a tag only builds and uploads workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.2.0 (empty: just build artifacts)"
        required: false
        default: ""

env:
  # The release tag: the pushed tag, or the one given to a manual run.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without a tag (manual run) tauri-action only builds.
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Bitling ${{ env.RELEASE_TAG }}
          releaseBody: |
            Download the installer for your system below, start Bitling, then right-click the pet → **Connect Claude Code…**
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload installers (manual runs)
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bitling-${{ matrix.platform }}${{ contains(matrix.args, 'x86_64') && '-intel' || '' }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
