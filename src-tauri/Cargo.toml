[package]
name = "bitling"
version = "0.2.0"
description = "A tiny pixel pet that lives in the corner of your screen and reacts to your AI coding agent."
authors = ["Bitling contributors"]
license = "MIT"
repository = "https://github.com/Blazkojj/bitling"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required for transparent windows on macOS.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: keep the key order of the user's Claude Code settings file.
serde_json = { version = "1", features = ["preserve_order"] }
# Tiny synchronous HTTP server: one thread, no async runtime needed for a
# handful of local requests per minute.
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
